<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="gradT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Fond arrondi -->
  <rect x="10" y="10" width="180" height="180" rx="36" ry="36" fill="url(#gradBg)"/>

  <!-- Lettre T stylisée -->
  <g transform="translate(100, 100)">
    <!-- Barre horizontale du T -->
    <rect x="-52" y="-62" width="104" height="24" rx="12" ry="12" fill="url(#gradT)" filter="url(#glow)"/>
    <!-- Barre verticale du T -->
    <rect x="-14" y="-40" width="28" height="90" rx="14" ry="14" fill="url(#gradT)" filter="url(#glow)"/>
  </g>

  <!-- Point d'accent (africain) -->
  <circle cx="150" cy="52" r="8" fill="#10B981" opacity="0.9"/>
</svg>
